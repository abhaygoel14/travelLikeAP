<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Success</title>
    <meta http-equiv="refresh" content="5;url=/thank-you/success" />
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            try {
                const params = new URLSearchParams(window.location.search);
                const txnid = params.get('txnid');
                const destination = '/thank-you/success' + (txnid ? '?txnid=' + encodeURIComponent(txnid) : '');
                window.location.replace(destination);
            } catch (error) {
                console.warn('Redirect to app failed:', error);
            }
        });
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f8ff;
            color: #102a43;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .page {
            text-align: center;
            max-width: 520px;
            padding: 24px;
            background: #ffffff;
            border: 1px solid #d9e2ec;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(16, 42, 67, 0.08);
        }

        h1 {
            margin-bottom: 12px;
            color: #1f74d3;
        }

        p {
            margin: 12px 0;
        }

        a {
            color: #1f74d3;
            text-decoration: none;
            font-weight: 600;
        }

        .notice {
            margin-top: 16px;
            font-size: 0.95rem;
            color: #486581;
        }
    </style>
</head>

<body>
    <div class="page">
        <h1>Payment successful</h1>
        <p>We are redirecting you to the application. If this does not happen automatically, use the link below.</p>
        <p class="notice">If the redirect fails, copy and paste this URL into your browser:</p>
        <p><a id="fallbackLink" href="/thank-you/success">/thank-you/success</a></p>
    </div>
</body>

</html>
